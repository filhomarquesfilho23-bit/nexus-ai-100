<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEXUS AI 100</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#00f0ff" />
  <style>
    body {
      background-color: #0d1117;
      color: #ffffff;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 30px 16px;
      margin: 0;
    }
    .caixa {
      max-width: 520px;
      margin: 0 auto;
    }
    h1 {
      color: #00bfff;
      margin-bottom: 8px;
    }
    textarea {
      width: 100%;
      box-sizing: border-box;
      background-color: #161b22;
      color: #ffffff;
      border: 1px solid #00bfff;
      border-radius: 8px;
      padding: 12px;
      font-size: 16px;
      margin-bottom: 14px;
      resize: vertical;
    }
    button {
      background-color: #00bfff;
      color: #000000;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    #resposta-area {
      margin-top: 20px;
      padding: 14px;
      background-color: #161b22;
      border: 1px solid #263241;
      border-radius: 8px;
      text-align: left;
      white-space: pre-wrap;
      line-height: 1.5;
      min-height: 45px;
    }
    .banner-area {
      margin-top: 24px;
      display: flex;
      justify-content: center;
    }
  </style>
</head>
<body>
  <div class="caixa">
    <h1>NEXUS AI 100</h1>
    <p>Ecossistema de 100 Agentes de Inteligência Artificial.</p>
    <textarea id="prompt-textarea" rows="4" placeholder="Digite a sua pergunta para a IA..."></textarea>
    <button id="enviar-btn" type="button">Enviar para a IA</button>
    <div id="resposta-area">A resposta aparecerá aqui...</div>
    <div class="banner-area" id="banner-area"></div>
  </div>
  <script src="script.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("/sw.js").catch(function () {});
      });
    }
  </script>
</body>
</html>
