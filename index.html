<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS AI 100 — Calculadora Falante & Criador de Sites</title>
  
  <!-- Ícones do Google Material -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

  <style>
    body {
      background-color: #040914;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 16px;
      box-sizing: border-box;
    }
    .container {
      max-width: 400px;
      width: 100%;
      background: rgba(255, 255, 255, 0.03);
      padding: 24px 16px;
      border-radius: 24px;
      border: 1px solid rgba(0, 210, 255, 0.1);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      margin-bottom: 20px;
    }
    
    /* Cabeçalho do App */
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      padding: 0 8px;
    }
    .app-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: bold;
      color: #00d2ff;
      font-size: 16px;
    }
    .voice-badge {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      color: #00ff88;
      background: rgba(0, 255, 136, 0.1);
      padding: 4px 10px;
      border-radius: 50px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Visor e Microfone integrados */
    .display-area {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
      align-items: stretch;
    }
    .visor {
      flex-grow: 1;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(0, 210, 255, 0.15);
      border-radius: 18px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-end;
      min-height: 80px;
      box-sizing: border-box;
    }
    .operation {
      color: #64748b;
      font-size: 14px;
      min-height: 18px;
      word-break: break-all;
    }
    .result {
      color: #00d2ff;
      font-size: 32px;
      font-weight: bold;
      word-break: break-all;
    }
    
    /* Botão de Voz / Microfone */
    .mic-button {
      width: 60px;
      background: linear-gradient(135deg, #00d2ff 0%, #0066ff 100%);
      border: none;
      border-radius: 18px;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 210, 255, 0.3);
      transition: all 0.2s ease;
    }
    .mic-button:active {
      transform: scale(0.92);
    }
    .mic-button.listening {
      background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.6);
      animation: pulseMic 1.5s infinite;
    }
    @keyframes pulseMic {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    /* Teclado da Calculadora */
    .keyboard {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }
    button.key {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.03);
      border-radius: 16px;
      color: #ffffff;
      font-size: 20px;
      font-weight: 500;
      padding: 16px 0;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    button.key:active {
      background: rgba(255, 255, 255, 0.12);
      transform: translateY(1px);
    }
    button.key.op {
      color: #00d2ff;
      background: rgba(0, 210, 255, 0.05);
    }
    button.key.clear {
      color: #ef4444;
      background: rgba(239, 68, 68, 0.08);
    }
    button.key.equal {
      color: #ffffff;
      background: linear-gradient(135deg, #00ff88 0%, #00b359 100%);
      font-weight: bold;
    }
    
    .btn-action-bottom {
      width: 100%;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 10px 0;
      color: #94a3b8;
      font-size: 13px;
      cursor: pointer;
    }

    /* Seção do Criador de Sites */
    .site-maker {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      text-align: left;
    }
    .maker-title {
      font-size: 16px;
      font-weight: bold;
      color: #00d2ff;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .input-group {
      margin-bottom: 12px;
    }
    .input-group label {
      display: block;
      font-size: 12px;
      color: #64748b;
      margin-bottom: 4px;
    }
    .input-group input {
      width: 100%;
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(0, 210, 255, 0.15);
      border-radius: 10px;
      padding: 10px;
      color: #fff;
      font-size: 14px;
      box-sizing: border-box;
    }
    .btn-generate {
      width: 100%;
      background: linear-gradient(135deg, #00ff88 0%, #00b359 100%);
      border: none;
      border-radius: 12px;
      padding: 12px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      font-size: 14px;
    }
    .alert-box {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
      border-radius: 12px;
      padding: 12px;
      color: #fca5a5;
      font-size: 12px;
      margin-top: 12px;
      display: none;
    }
    .success-box {
      background: rgba(0, 255, 136, 0.1);
      border: 1px solid rgba(0, 255, 136, 0.2);
      border-radius: 12px;
      padding: 12px;
      color: #a7f3d0;
      font-size: 12px;
      margin-top: 12px;
      display: none;
      word-break: break-all;
    }

    /* Rodapé para Download Oficial */
    .download-footer {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }
    .btn-download {
      display: inline-block;
      width: 100%;
      padding: 14px 0;
      background: linear-gradient(135deg, #00d2ff 0%, #0066ff 100%);
      color: #ffffff;
      text-decoration: none;
      font-weight: bold;
      border-radius: 14px;
      box-shadow: 0 4px 15px rgba(0, 210, 255, 0.25);
      font-size: 14px;
      box-sizing: border-box;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- Cabeçalho -->
    <div class="app-header">
      <div class="app-title">
        <span>🤖</span>
        <span>Calculadora Falante AI</span>
      </div>
      <!-- Botão para Inserir API do Gemini -->
      <button onclick="promptApiKey()" style="background:none; border:none; color:#00d2ff; cursor:pointer;" title="Configurar Chave API">
        <span class="material-symbols-outlined" style="font-size: 24px;">key</span>
      </button>
      <div class="voice-badge" id="voiceStatus">
        <span class="material-symbols-outlined" style="font-size: 16px;">volume_up</span>
        <span>Voz Ativa</span>
      </div>
    </div>

    <!-- Visor + Botão de Microfone -->
    <div class="display-area">
      <div class="visor">
        <div class="operation" id="visorOperation"></div>
        <div class="result" id="visorResult">0</div>
      </div>
      
      <!-- Botão de Microfone de Voz -->
      <button class="mic-button" id="micBtn" onclick="toggleVoiceInput()" title="Falar conta">
        <span class="material-symbols-outlined" id="micIcon" style="font-size: 28px;">mic</span>
      </button>
    </div>

    <!-- Teclado de Botões -->
    <div class="keyboard">
      <button class="key clear" onclick="clearVisor()">C</button>
      <button class="key op" onclick="addChar('(')">(</button>
      <button class="key op" onclick="addChar(')')">)</button>
      <button class="key op" onclick="addChar('/')">÷</button>

      <button class="key" onclick="addChar('7')">7</button>
      <button class="key" onclick="addChar('8')">8</button>
      <button class="key" onclick="addChar('9')">9</button>
      <button class="key op" onclick="addChar('*')">×</button>

      <button class="key" onclick="addChar('4')">4</button>
      <button class="key" onclick="addChar('5')">5</button>
      <button class="key" onclick="addChar('6')">6</button>
      <button class="key op" onclick="addChar('-')">-</button>

      <button class="key" onclick="addChar('1')">1</button>
      <button class="key" onclick="addChar('2')">2</button>
      <button class="key" onclick="addChar('3')">3</button>
      <button class="key op" onclick="addChar('+')">+</button>

      <button class="key" onclick="addChar('0')">0</button>
      <button class="key" onclick="addChar('.')">,</button>
      <button class="key op" onclick="addChar('%')">%</button>
      <button class="key equal" onclick="calculateResult()">=</button>
    </div>

    <button class="btn-action-bottom" onclick="backspace()">⌫ Apagar Dígito</button>

    <!-- Criador de Sites IA (Gemini 3.8 Flash) -->
    <div class="site-maker">
      <div class="maker-title">
        <span class="material-symbols-outlined">auto_awesome</span>
        <span>Criador de Sites por IA</span>
      </div>
      
      <div class="input-group">
        <label for="compName">Nome da Empresa</label>
        <input type="text" id="compName" placeholder="Ex: Nexus Tech, Padaria Silva">
      </div>
      
      <div class="input-group">
        <label for="compBranch">Ramo de Atuação / Especialidade</label>
        <input type="text" id="compBranch" placeholder="Ex: Inteligência Artificial, Panificação">
      </div>
      
      <div class="input-group">
        <label for="compDiff">Diferenciais (Separados por vírgulas)</label>
        <input type="text" id="compDiff" placeholder="Ex: Suporte 24h, Entrega rápida, Garantia">
      </div>
      
      <button class="btn-generate" onclick="generateSite()">✨ Gerar Site com IA Grátis Agora</button>
      
      <div class="alert-box" id="makerAlert"></div>
      <div class="success-box" id="makerSuccess"></div>
    </div>

    <!-- Rodapé para Download Oficial -->
    <div class="download-footer">
      <a href="https://is.gd/nexusia100oficial" target="_blank" rel="noopener noreferrer" class="btn-download">
        📥 BAIXAR APK NEXUS AI 100
      </a>
    </div>

  </div>

  <!-- Lógica Inteligente de Voz, Cálculo e Criador de Sites IA -->
  <script type="module">
    // Carrega o SDK do Google Generative AI de forma estável para Web
    import { GoogleGenerativeAI } from "https://esm.run/@google/generative-ai";

    let visorOp = document.getElementById("visorOperation");
    let visorRes = document.getElementById("visorResult");
    let micBtn = document.getElementById("micBtn");
    let micIcon = document.getElementById("micIcon");
    let voiceActive = true;
    let isListening = false;
    let recognition;
    let geminiApiKey = localStorage.getItem("gemini_api_key") || "";

    // Configurar API Key
    window.promptApiKey = function() {
      let key = prompt("Insira a sua Chave da API do Gemini (AIzaSy...):", geminiApiKey);
      if (key !== null) {
        geminiApiKey = key.trim();
        localStorage.setItem("gemini_api_key", geminiApiKey);
        alert("Chave salva com sucesso!");
        document.getElementById("makerAlert").style.display = "none";
      }
    }

    // Configurar Voz Ativa (Ouvir cliques)
    function speak(text) {
      if (!voiceActive) return;
      window.speechSynthesis.cancel();
      let utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "pt-BR";
      window.speechSynthesis.speak(utterance);
    }

    window.addChar = function(char) {
      if (visorRes.innerText === "0" && !isNaN(char)) {
        visorRes.innerText = char;
      } else {
        visorRes.innerText += char;
      }
      
      let speakName = char;
      if (char === '+') speakName = "mais";
      if (char === '-') speakName = "menos";
      if (char === '*') speakName = "vezes";
      if (char === '/') speakName = "dividido por";
      if (char === '%') speakName = "por cento";
      if (char === '.') speakName = "vírgula";
      if (char === '(') speakName = "abre parênteses";
      if (char === ')') speakName = "fecha parênteses";
      
      speak(speakName);
    }

    window.clearVisor = function() {
      visorOp.innerText = "";
      visorRes.innerText = "0";
      speak("limpar");
    }

    window.backspace = function() {
      let text = visorRes.innerText;
      if (text.length > 1) {
        visorRes.innerText = text.slice(0, -1);
      } else {
        visorRes.innerText = "0";
      }
      speak("apagar");
    }

    window.calculateResult = function() {
      try {
        let rawExpression = visorRes.innerText;
        // Substituir operadores para o cálculo interno do JS
        let evalExpression = rawExpression.replace(/÷/g, '/').replace(/×/g, '*').replace(/%/g, '/100');
        
        let calculation = eval(evalExpression);
        
        // Se der resultado válido, mostra e fala
        if (calculation !== undefined && !isNaN(calculation)) {
          visorOp.innerText = rawExpression + " =";
          visorRes.innerText = calculation;
          speak("igual a " + calculation);
        }
      } catch (err) {
        visorRes.innerText = "Erro";
        speak("Erro na conta");
      }
    }

    // INTERFACE DE VOZ / MICROFONE (Cálculo por Voz)
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.lang = 'pt-BR';

      recognition.onstart = () => {
        isListening = true;
        micBtn.classList.add('listening');
        micIcon.innerText = 'mic_active';
        visorOp.innerText = "Ouvindo voz...";
        visorRes.innerText = "Fale agora...";
        speak("Pode falar");
      };

      recognition.onend = () => {
        isListening = false;
        micBtn.classList.remove('listening');
        micIcon.innerText = 'mic';
      };

      recognition.onerror = () => {
        visorOp.innerText = "Voz não reconhecida";
        visorRes.innerText = "Tente de novo";
        speak("Não entendi");
      };

      recognition.onresult = (event) => {
        let voiceInput = event.results[0][0].transcript.toLowerCase();
        visorOp.innerText = "Ouvido: " + voiceInput;

        let processed = voiceInput
          .replace(/vezes/g, '*')
          .replace(/x/g, '*')
          .replace(/multiplicado por/g, '*')
          .replace(/mais/g, '+')
          .replace(/menos/g, '-')
          .replace(/dividido por/g, '/')
          .replace(/por/g, '/')
          .replace(/igual/g, '')
          .replace(/quanto é/g, '')
          .replace(/,/g, '.')
          .replace(/\s+/g, ''); // Remove espaços

        visorRes.innerText = processed;
        
        setTimeout(() => {
          calculateResult();
        }, 1200);
      };

    } else {
      micBtn.style.display = "none";
    }

    window.toggleVoiceInput = function() {
      if (!recognition) {
        alert("O seu telemóvel não suporta entrada de voz no navegador.");
        return;
      }
      
      if (isListening) {
        recognition.stop();
      } else {
        recognition.start();
      }
    }

    // Toggle de Voz ativa no badge
    document.getElementById("voiceStatus").onclick = function() {
      voiceActive = !voiceActive;
      this.style.opacity = voiceActive ? "1" : "0.5";
      if(voiceActive) {
        speak("Voz ativa");
      }
    }

    // Lógica do Criador de Sites IA (Gerar Site usando Gemini 3.8 Flash)
    window.generateSite = async function() {
      const name = document.getElementById("compName").value.trim();
      const branch = document.getElementById("compBranch").value.trim();
      const diff = document.getElementById("compDiff").value.trim();
      const alertBox = document.getElementById("makerAlert");
      const successBox = document.getElementById("makerSuccess");

      alertBox.style.display = "none";
      successBox.style.display = "none";

      if (!geminiApiKey) {
        alertBox.innerText = "Erro: Configure a sua Chave da API do Gemini clicando no ícone de chave no topo!";
        alertBox.style.display = "block";
        return;
      }

      if (!name || !branch) {
        alertBox.innerText = "Atenção: Preencha o Nome da Empresa e o Ramo/Especialidade!";
        alertBox.style.display = "block";
        return;
      }

      alertBox.innerText = "IA pensando e gerando o site... Aguarde.";
      alertBox.style.display = "block";

      try {
        const genAI = new GoogleGenerativeAI(geminiApiKey);
        // USANDO O MODELO ATUALIZADO 3.8-FLASH PARA EVITAR HTTP 404
        const model = genAI.getGenerativeModel({ model: "gemini-3.8-flash" });

        const prompt = `Gere o código HTML completo, moderno e responsivo para uma landing page de uma empresa chamada "${name}" que atua no ramo de "${branch}". 
        Seus diferenciais são: "${diff}". Quero um design premium no estilo escuro (dark cyber), com botões para contato via WhatsApp fictício, seções de diferenciais, chamativas e scripts de animações visuais simples.`;

        const result = await model.generateContent(prompt);
        const response = await result.response;
        const htmlCode = response.text();

        // Salvar código gerado em arquivo ou permitir visualização
        const blob = new Blob([htmlCode], { type: "text/html" });
        const url = URL.createObjectURL(blob);

        alertBox.style.display = "none";
        successBox.innerHTML = `🎉 Site criado com sucesso!<br><br>
        <a href="${url}" target="_blank" style="color:#00ff88; font-weight:bold; text-decoration:underline;">Clique aqui para visualizar o site gerado</a>`;
        successBox.style.display = "block";

      } catch (err) {
        alertBox.innerHTML = "Erro ao gerar o site pela IA: " + err.message + "<br><br>Verifique se sua Chave de API está correta e tente de novo.";
        alertBox.style.display = "block";
      }
    }
  </script>

</body>
</html>
